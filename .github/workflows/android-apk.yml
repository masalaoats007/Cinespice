name: Build Cinespice Android APK
on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to build
        type: choice
        options: [both, configured, standard]
        default: both
  push:
    branches: [IOS, android, 'coderabbit/android-app-build/**', 'coderabbit/configure-api-credential-builds/**']
    paths: ['android/**', '.github/workflows/android-apk.yml', 'scripts/configure-telegram.py']
  pull_request:
    paths: ['android/**', '.github/workflows/android-apk.yml', 'scripts/configure-telegram.py']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/coderabbit/')) || inputs.edition == 'standard') && '["standard"]' || inputs.edition == 'configured' && '["configured"]' || '["standard","configured"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - name: Test build configuration isolation
        run: python3 ../scripts/test_build_configuration.py
      - name: Generate Telegram build configuration
        env:
          TELEGRAM_API_ID: ${{ github.event_name != 'pull_request' && matrix.edition == 'configured' && secrets.TELEGRAM_API_ID || '' }}
          TELEGRAM_API_HASH: ${{ github.event_name != 'pull_request' && matrix.edition == 'configured' && secrets.TELEGRAM_API_HASH || '' }}
        run: python3 ../scripts/configure-telegram.py --platform android --mode "${{ matrix.edition }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action defaults include the retired SDK package "tools".
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Fetch pinned TDLib binaries
        run: ./prepare-tdlib.sh
      - name: Test, lint, and build installable APKs
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintOptimized :app:assembleOptimized
      - uses: actions/upload-artifact@v4
        with:
          name: Cinespice-${{ matrix.edition }}-Android-arm64-v8a
          path: android/app/build/outputs/apk/optimized/app-arm64-v8a-optimized.apk
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Cinespice-${{ matrix.edition }}-Android-armeabi-v7a
          path: android/app/build/outputs/apk/optimized/app-armeabi-v7a-optimized.apk
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Cinespice-${{ matrix.edition }}-Android-x86_64
          path: android/app/build/outputs/apk/optimized/app-x86_64-optimized.apk
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cinespice-${{ matrix.edition }}-Android-diagnostics
          path: |
            android/app/build/reports/
            android/app/build/outputs/mapping/optimized/
          if-no-files-found: ignore
