name: Build Cinespice IPA

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to build
        type: choice
        options: [both, configured, standard]
        default: both
  push:
    branches: [IOS, main, master, 'coderabbit/configure-api-credential-builds/**']
    paths:
      - ".github/workflows/ios-ipa.yml"
      - "Package.swift"
      - "Podfile"
      - "Podfile.lock"
      - "project.yml"
      - "Sources/**"
      - "Resources/**"
      - "Support/**"
      - "Tests/**"
      - "scripts/**"
  pull_request:
    branches: [IOS, main, master]
    paths:
      - ".github/workflows/ios-ipa.yml"
      - "Package.swift"
      - "Podfile"
      - "Podfile.lock"
      - "project.yml"
      - "Sources/**"
      - "Resources/**"
      - "Support/**"
      - "Tests/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/coderabbit/')) || inputs.edition == 'standard') && '["standard"]' || inputs.edition == 'configured' && '["configured"]' || '["standard","configured"]') }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Test build configuration isolation
        run: python3 scripts/test_build_configuration.py
      - name: Generate Telegram build configuration
        env:
          TELEGRAM_API_ID: ${{ github.event_name != 'pull_request' && matrix.edition == 'configured' && secrets.TELEGRAM_API_ID || '' }}
          TELEGRAM_API_HASH: ${{ github.event_name != 'pull_request' && matrix.edition == 'configured' && secrets.TELEGRAM_API_HASH || '' }}
        run: python3 scripts/configure-telegram.py --platform ios --mode "${{ matrix.edition }}"
      - name: Test streaming protocol and scheduling
        run: swift test
      - name: Install build tools
        run: |
          brew install xcodegen
          if ! command -v pod >/dev/null 2>&1; then
            gem install cocoapods --no-document
          fi
      - name: Record build tool versions
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version
          pod --version
      - name: Generate project and resolve TDLib
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -resolvePackageDependencies -project Tevee.xcodeproj -scheme Tevee
      - name: Install VLC
        run: |
          pod install --project-directory=.
      - name: Build unsigned app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace Tevee.xcworkspace \
            -scheme Tevee \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tevee.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/xcodebuild.log
      - name: Package IPA for SideStore signing
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Tevee.app"
          test -d "$APP_PATH"
          python3 scripts/verify-app-metadata.py "$APP_PATH/Info.plist"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -r ../Cinespice-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Cinespice-${{ matrix.edition }}-unsigned-ipa
          path: build/Cinespice-unsigned.ipa
          if-no-files-found: error
      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Cinespice-${{ matrix.edition }}-build-diagnostics
          path: |
            build/xcodebuild.log
            build/Tevee.xcresult
            Podfile.lock
            Tevee.xcworkspace/xcshareddata/swiftpm/Package.resolved
            Tevee.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
          retention-days: 7
